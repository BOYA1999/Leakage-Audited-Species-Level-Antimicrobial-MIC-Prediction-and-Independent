[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "species-mic-multiview"
version = "0.1.0"
description = "Leakage-controlled species-level antimicrobial MIC prediction"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["amr_multiview*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
